# Fails a push or pull request that tracks a secret. This repository is public: a pushed secret
# stays readable in its history even after the file is removed. See setup/check-secrets.sh.
name: secrets check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: setup/check-secrets.sh
